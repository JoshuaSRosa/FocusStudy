services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      - DB_HOST=DB_HOST
      - DB_PORT=DB_PORT
      - DB_USER=DB_USER
      - DB_PASS=DB_PASS
      - DB_NAME=DB_NAME
    ports:
      - "8080:8080"
    networks:
      - "app_network"

networks:
  app_network:
    driver: bridge